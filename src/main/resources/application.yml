spring:
  application:
    name: filereader
  datasource:
    url: jdbc:mysql://localhost:3306/filereader?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      connection-timeout: 3000
  jpa:
    show-sql: true
